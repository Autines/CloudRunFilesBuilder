name: Make 25-clashoo latest Version

on:
  schedule:
    - cron: "3 22 * * *"  # 北京时间早上 6 点 03
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest prerelease info
        id: fetch_release
        run: |
          curl -s https://api.github.com/repos/kenzok8/openwrt-clashoo/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json

      - name: Parse asset download URLs
        id: parse_assets
        run: |
          # 精确匹配文件名，并用 head -1 确保只取第一个，再用 tr 清除换行
          X86_URL=$(jq -r -c '.assets[] | select(.name | test("^clashoo-.*-x86_64\\.apk$")) | .browser_download_url' release.json | head -1 | tr -d '\n')
          LUCI_MAIN_URL=$(jq -r -c '.assets[] | select(.name | test("^luci-app-clashoo-.*-x86_64\\.apk$")) | .browser_download_url' release.json | head -1 | tr -d '\n')
          LUCI_I18N_URL=$(jq -r -c '.assets[] | select(.name | test("^luci-i18n-clashoo-zh-cn-.*-x86_64\\.apk$")) | .browser_download_url' release.json | head -1 | tr -d '\n')

          printf "X86_URL=%s\n" "$X86_URL" >> $GITHUB_ENV
          printf "LUCI_MAIN_URL=%s\n" "$LUCI_MAIN_URL" >> $GITHUB_ENV
          printf "LUCI_I18N_URL=%s\n" "$LUCI_I18N_URL" >> $GITHUB_ENV

      - name: Download apk files
        run: |
          mkdir -p x86
          for url in "$X86_URL" "$LUCI_MAIN_URL" "$LUCI_I18N_URL"; do
            if [ -z "$url" ]; then
              echo "错误：检测到空的下载 URL，请检查 release.json 中的资产名称是否匹配。"
              exit 1
            fi
          done

          wget -q "$X86_URL" -P x86/
          wget -q "$LUCI_MAIN_URL" -P x86/
          wget -q "$LUCI_I18N_URL" -P x86/

          fname=$(basename "$X86_URL")
          VERSION=$(echo "$fname" | grep -oP '\d{4}\.\d{2}\.\d{2}')
          printf "VERSION=%s\n" "$VERSION" >> $GITHUB_ENV
          echo "提取到版本号: $VERSION"

      - name: Create install.sh scripts
        run: |
          cat <<'EOF' > x86/install.sh
          #!/bin/sh
          apk update
          if [ $? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          apk add --allow-untrusted clashoo-*.apk
          apk add --allow-untrusted luci-app-clashoo-*.apk
          apk add --allow-untrusted luci-i18n-clashoo-zh-cn-*.apk
          EOF
          chmod +x x86/install.sh

      - name: Move directories to makeself
        run: |
          mv x86 makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          ./makeself.sh x86/ clashoo-${VERSION}-x86_64.run "by github action" ./install.sh

      - name: Check file sizes
        run: |
          ls -lh makeself/clashoo-*.run

      - name: Preparing release name
        run: |
          release_name=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M Build')
          printf "RELEASE_NAME=%s\n" "$release_name" >> $GITHUB_ENV

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          printf "tag_name=%s\n" "$TODAY" >> $GITHUB_ENV
          
      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/wkccd/CloudRunFilesBuilder/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=blue&color=black"/>
              <a href="https://wkdaily.cpolar.cn/archives/1">
                <img src="https://img.shields.io/badge/可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
              </a>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
