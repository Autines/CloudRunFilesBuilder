name: Make 25-clashoo latest Version

on:
  schedule:
    - cron: "3 22 * * *"   # 北京时间早上 6 点 03
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write      # 创建 Release 所需权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest prerelease info
        id: fetch_release
        run: |
          curl -s https://api.github.com/repos/kenzok8/openwrt-clashoo/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json

      - name: Parse asset download URLs
        id: parse_assets
        run: |
          X86_URL=$(jq -r '.assets[] | select(.name | test("clashoo_.*-x86_64.apk")) | .browser_download_url' release.json)
          ARM_URL=$(jq -r '.assets[] | select(.name | test("clashoo_.*-aarch64_cortex-a53.apk")) | .browser_download_url' release.json)
          LUCI_MAIN_URL=$(jq -r '.assets[] | select(.name | test("luci-app-clashoo-.*all.apk")) | .browser_download_url' release.json)
          LUCI_I18N_URL=$(jq -r '.assets[] | select(.name | test("luci-i18n-clashoo-zh-cn-.*all.apk")) | .browser_download_url' release.json)

          echo "X86_URL=$X86_URL" >> $GITHUB_ENV
          echo "ARM_URL=$ARM_URL" >> $GITHUB_ENV
          echo "LUCI_MAIN_URL=$LUCI_MAIN_URL" >> $GITHUB_ENV
          echo "LUCI_I18N_URL=$LUCI_I18N_URL" >> $GITHUB_ENV

      - name: Download apk files
        run: |
          mkdir -p x86 arm64
          # 检查变量是否为空，避免 wget 报错
          for url in "$X86_URL" "$ARM_URL" "$LUCI_MAIN_URL" "$LUCI_I18N_URL"; do
            if [ -z "$url" ]; then
              echo "警告: 某个下载 URL 为空，请检查 release.json 中的 asset 名称是否匹配"
              exit 1
            fi
          done
          wget -q "$X86_URL" -P x86/
          wget -q "$ARM_URL" -P arm64/
          wget -q "$LUCI_MAIN_URL" -P x86/
          wget -q "$LUCI_MAIN_URL" -P arm64/
          wget -q "$LUCI_I18N_URL" -P x86/
          wget -q "$LUCI_I18N_URL" -P arm64/

          # 从 x86 的 clashoo 文件名提取日期版本号
          fname=$(basename "$X86_URL")
          VERSION=$(echo "$fname" | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "提取到版本号: $VERSION"

      - name: Create install.sh scripts
        run: |
          cat << 'EOF' > x86/install.sh
          #!/bin/sh
          apk update
          if [ $? -ne 0 ]; then
              echo "update failed."
              exit 1
          fi
          apk add --allow-untrusted clashoo-*.apk
          apk add --allow-untrusted luci-app-clashoo-*.apk
          apk add --allow-untrusted luci-i18n-clashoo-zh-cn-*.apk
          EOF
          chmod +x x86/install.sh
          cp x86/install.sh arm64/install.sh

      - name: Move directories to makeself
        run: |
          mkdir -p makeself
          mv x86 arm64 makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          chmod +x ../makeself/makeself.sh
          ../makeself/makeself.sh x86/ clashoo-${VERSION}-x86_64.run "by github action" ./install.sh
          ../makeself/makeself.sh arm64/ clashoo-${VERSION}-aarch64_a53.run "by github action" ./install.sh

      - name: Check file sizes
        run: ls -lh makeself/clashoo_*.run

      - name: Preparing release name
        run: |
          release_name=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M Build')
          echo "RELEASE_NAME=$release_name" >> $GITHUB_ENV

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
